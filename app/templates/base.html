<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Research workspace{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/">Research workspace</a>
    <span class="masthead-note">Personal · United States</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="colophon">
    Evidence, derived metrics, and interpretation are labeled separately throughout.
    A conclusion without a source is a defect, not a style choice.
  </footer>
</body>
</html>
